<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메추샵</title>
    <!-- 구글 폰트 & 아이콘 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans KR', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #fff;
            color: #333;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- 상단 헤더 --- */
        header {
            position: sticky;
            top: 0;
            background-color: #fff;
            border-bottom: 1px solid #f2f2f2;
            z-index: 100;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
        }

        .logo-box {
            background-color: #fee500;
            color: #191919;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .search-bar {
            flex: 0 1 400px;
            position: relative;
            margin: 0 20px;
        }

        .search-bar input {
            width: 100%;
            height: 42px;
            background-color: #f3f3f3;
            border: none;
            border-radius: 21px;
            padding: 0 45px 0 20px;
            font-size: 14px;
            outline: none;
        }

        .search-bar .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
        }

        .header-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .menu-btn {
            font-size: 24px;
            color: #333;
            cursor: pointer;
        }

        /* --- 메인 네비게이션 --- */
        .main-nav {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            gap: 30px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 500;
            border-bottom: 1px solid #f9f9f9;
        }

        .nav-item {
            position: relative;
            cursor: pointer;
            color: #777;
        }

        .nav-item.active {
            color: #191919;
            font-weight: 700;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #191919;
        }

        /* --- 메인 컨텐츠 영역 --- */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 80px;
        }

        /* 배너 섹션 */
        .banner-slider {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #ffeb60 0%, #fcd200 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .banner-text h2 {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            color: #191919;
        }

        .banner-text p {
            font-size: 15px;
            color: #555;
        }

        .banner-img {
            font-size: 120px;
            user-select: none;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 섹션 타이틀 */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title h3 {
            font-size: 20px;
            font-weight: 700;
        }

        .section-title .more {
            font-size: 14px;
            color: #777;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* --- 이모티콘 리스트 그리드 --- */
        .emoticon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 24px 16px;
            margin-bottom: 50px;
        }

        .emoticon-card {
            cursor: pointer;
        }

        .img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #f8f8f8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            transition: transform 0.2s ease;
            margin-bottom: 10px;
        }

        .emoticon-card:hover .img-wrap {
            transform: scale(1.03);
        }

        .emoticon-info .title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .emoticon-info .author {
            font-size: 12px;
            color: #999;
        }

        /* --- 모바일 대응 반응형 스타일 --- */
        @media (max-width: 768px) {
            .header-container {
                height: 60px;
            }
            .search-bar {
                display: none; /* 모바일에선 보통 별도 아이콘 처리 */
            }
            .banner-slider {
                height: 160px;
                padding: 0 25px;
            }
            .banner-text h2 {
                font-size: 18px;
            }
            .banner-text p {
                font-size: 12px;
            }
            .banner-img {
                font-size: 70px;
            }
            .emoticon-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px 10px;
            }
            .img-wrap {
                font-size: 50px;
            }
            .emoticon-info .title {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 -->
    <header>
        <div class="header-container">
            <div class="logo-area">
                <span>메추샵</span>
            </div>
            
            <div class="search-bar">
                <input type="text" placeholder="검색은 안되고 그냥 장식입니다">
            </div>

            <div class="header-menu">
                <span class="material-symbols-outlined menu-btn">menu</span>
            </div>
        </div>
    </header>

    <!-- 메인 탭 네비게이션 -->
    <nav class="main-nav">
        <div class="nav-item active">홈</div>
        <div class="nav-item" onclick="alert('인기 없는되?')">인기</div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <main>

        <!-- 주목받는 이모티콘 섹션 -->
        <section>
            <div class="section-title">
                <h3>이모티콘</h3>
                <a href="https://www.google.com/search?sca_esv=3c3eda1713c91f80&sxsrf=APpeQntablgECMPeDJdNb0TJGP5Uzs1tYA:1783837211396&udm=2&fbs=ABfTbFVyMZGZf1hfvX9uKjN_-G8c4u0nXx4bEIpwm1lnNH832QGGMdFXpDyzkQgEdtB8w9zZ67Faapx8wIWp8O3JpX8ZbooJTg6IC0i9eLmD380spG6aLHYWmiIL-SehB9tEHFuxn7V4s9NE-Nwvl-LiFJV1P9cjajKaS09GkFqD-niohmW1j3oiiITXIHg6NW--ImJLJZjv74RUylwcchtJHqLycsYz_Q&q=%EC%A0%84%EC%B2%B4&sa=X&ved=2ahUKEwiT18m6v8yVAxWaa_UHHd9RF8sQtKgLegQIExAB&biw=1280&bih=626&dpr=2" class="more">전체보기</a>
            </div>

            <div class="emoticon-grid">
                <!-- 아이템 1 -->
                <div class="emoticon-card"><a href="penti.html">
                    <div class="img-wrap"><img id="pv" src="penti/fuckyou.png" width="80%" alt=""></div>
                    <div class="emoticon-info">
                        <div class="title">펜티 시즌1</div>
                        <div class="author">명진구스튜디오</div>
                    </div></a>
                </div>
                <!-- 아이템 2 -->
                <div class="emoticon-card"><a href="pentii.html">
                    <div class="img-wrap"><img id="pv" src="pentii/sunpraise.png" width="80%" alt=""></div>
                    <div class="emoticon-info">
                        <div class="title">펜티 시즌2</div>
                        <div class="author">명진구스튜디오</div>
                    </div></a>
                </div>
        </section>

        <!-- 실시간 인기 섹션 -->
        
    </main>

    <!-- 간단한 탭 전환 인터랙션 JS -->
    <script>
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>
</body>
</html>
