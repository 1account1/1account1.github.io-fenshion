<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>펜션360도로 보기</title>
    <script>
        let vidd = 0;
        function loop(){
            setTimeout(() => {
                vidd += 0.05;
                if (vidd > 6.8){
                    vidd = 0;
                }
                document.getElementById('vid').currentTime = vidd;
                loop();
            }, 50);
        }
        document.addEventListener("DOMContentLoaded", function (){
            document.getElementById('vid').height = window.innerHeight;
            loop();
        })
    </script>
    <style>
        body{
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <video id="vid" height="100" src="Video.mov"></video>
</body>
</html>
